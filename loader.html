<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LUSANO Loader Preview</title>
    <link rel="stylesheet" href="assets/css/loader.css" />
    <style>
      body { margin: 0; min-height: 200vh; background: #f6f7f9; }
      main { padding: 32px; font-family: system-ui, -apple-system, Segoe UI, Roboto, Inter, "Helvetica Neue", Arial, "Noto Sans"; }
    </style>
  </head>
  <body>
    <div id="page-loader" role="status" aria-live="polite" aria-label="Page loading">
      <div class="loader-content" aria-hidden="true">
        <div class="loader-brand">LUSANO</div>
        <div class="water-gauge">
          <div class="water-level">
            <div class="wave"></div>
            <div class="wave wave2"></div>
          </div>
        </div>
        <p class="loader-subtext">Loading...</p>
      </div>
    </div>

    <main>
      <h1>Loader Preview</h1>
      <p>This is a standalone demo page for the LUSANO loader. Scroll to verify it overlays correctly.</p>
    </main>

    <script src="assets/js/loader.js" defer></script>
  </body>
</html>
